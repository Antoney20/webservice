<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEMA — Web Service</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
  }
  .card__accent { height: 4px; background: #27aae1; }
  .card__body { padding: 40px 36px 36px; text-align: center; }
  .logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #27aae1;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  h1 { font-size: 22px; font-weight: 600; color: #111827; margin-bottom: 8px; }
  p.subtitle { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 1.55; }
  .warning {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 28px;
    text-align: left;
  }
  .warning svg { flex-shrink: 0; }
  .warning p {
    font-size: 13px;
    color: #9a3412;
    line-height: 1.4;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 12px 20px;
    background: #27aae1;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
  }
  .btn:hover { background: #1f8dbd; }
  .footer { margin-top: 28px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="card">
    <div class="card__accent"></div>
    <div class="card__body">
      <h1>Welcome to CEMA</h1>
      <p class="subtitle">Centre for Epidemiological Modelling and Analysis<br>The University of Nairobi </p>

      <div class="warning">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <p>You are not supposed to be here.</p>
      </div>

      <a class="btn" href="https://cema-africa.uonbi.ac.ke">Visit CEMA Website</a>
      <div class="footer">© {% now "Y" %} CEMA, University of Nairobi</div>
    </div>
  </div>
</body>
</html>
